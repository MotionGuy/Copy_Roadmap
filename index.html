<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Roadmap</title>
<link rel="preload" href="fonts/instrument-serif-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/jost-var.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/site.css">
</head>
<body>
<canvas id="sky" aria-hidden="true"></canvas>
<nav class="tabs" aria-label="Sections"><div class="wrap">
  <div class="navrow">
    <div class="groups" id="grouplist" role="group" aria-label="Areas"></div>
    <div class="subs" id="tablist" role="tablist"></div>
    <div class="hd-r"><div class="small muted" id="sync"></div></div>
  </div>
</div></nav>

<main class="wrap">
  <section class="tab" id="plan"></section>
  <section class="tab" id="todo"></section>
  <section class="tab" id="apps"></section>
  <section class="tab" id="school"></section>
  <section class="tab" id="later"></section>
  <section class="tab" id="study"></section>
  <section class="tab" id="projects"></section>
  <section class="tab" id="portfolio"></section>
  <section class="tab" id="certs"></section>
</main>
<div id="wx" aria-hidden="true"></div>
<div class="mapover" id="map" hidden></div>
<div class="mapover" id="reqs" hidden></div>
<div class="mapover" id="fit" hidden></div>
<div class="mapover" id="watchouts" hidden></div>
<div class="mapover" id="find" hidden></div>
<div class="mapover" id="targets" hidden></div>
<div class="mapover" id="bigcal" hidden></div>
<div class="mapover" id="skill" hidden></div>
<div class="mapover" id="notesbig" hidden></div>
<div class="setover" id="settings" hidden></div>
<button class="gear" id="settings-open" type="button" aria-label="Settings" title="Settings"><svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<input type="file" id="loadfile" accept="application/json,.json">

<!-- Settings are in config.js and the content (tasks, classes, projects and the rest) in content/content.js. Styles are in css/site.css. See README.md. -->
<script src="config.js"></script>
<script src="content/content.js"></script>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script src="js/day.js"></script>
<script src="js/work.js"></script>
<script src="js/school.js"></script>
<script src="js/home.js"></script>
<!-- The backdrop is optional: it loads only when config.js turns it on, and the site runs the same without the file. -->
<script>if (CONFIG.scene === true) document.write('<script src="js/scene.js"><\/script>');</script>
<script src="js/boot.js"></script>
</body>
</html>
